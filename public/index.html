<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sing-in</title>
</head>

<body>
    <h1>Google Sing-In </h1>
    <hr>

    <div id="g_id_onload" data-client_id="884522527621-1jscb7pctcfeh4el8ecqjbrap9bbohpb.apps.googleusercontent.com"
        data-auto_prompt="false" data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"
        data-shape="rectangular" data-logo_alignment="left">
    </div>

    <button id="google_singout">
        Sing-Out
    </button>

    <script>
        function handleCredentialResponse(response) {

            //Google Token: ID_TOKEN
            //console.log(response.credential);

            //obtenemos el token de google
            const body = {
                id_token: response.credential
            }

            let url = ( window.location.hostname.includes('localhost') )
                    ? 'http://localhost:8080/api/auth/google'
                    : 'https://rest-server-aohm.onrender.com';

            

            //pasamos los datos al backend
            fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(body)

                })

                .then(resp => resp.json())
                .then(resp => {
                    console.log(resp)
                    //gurdamos el correo en el localstorage
                    localStorage.setItem('correoGoogle', resp.usuario.correo)
                })
                .catch(console.warn);


        }
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.querySelector('#google_singout');

            button.onclick = () => {
                // console.log(google.accounts.id); //tiene varias opciones

                google.accounts.id.disableAutoSelect();

                google.accounts.id.revoke(localStorage.getItem('correoGoogle'), done => {
                    if (done.successful) {
                        localStorage.clear();
                        location.reload();
                    } else {
                        console.error('Error al cerrar sesión:', done.error);
                    }
                });


            }
        });
    </script>

    <script src="https://accounts.google.com/gsi/client" async></script>

</body>

</html>
